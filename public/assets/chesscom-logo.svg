<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="chesscom-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88c353"/>
      <stop offset="100%" stop-color="#699b38"/>
    </linearGradient>
    <filter id="pawn-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#3c5e1c" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Authentic Chess.com Rounded Green App Badge -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#chesscom-bg-grad)"/>
  <rect x="2" y="42" width="44" height="4" rx="2" fill="#55812b" opacity="0.6"/>
  <!-- Signature Chess.com Pawn Silhouette -->
  <g filter="url(#pawn-shadow)">
    <!-- Pawn Head -->
    <circle cx="24" cy="14" r="5.5" fill="#ffffff"/>
    <!-- Pawn Collar -->
    <path d="M19 20 C19 18.8 29 18.8 29 20 C28 21.5 20 21.5 19 20 Z" fill="#ffffff"/>
    <!-- Pawn Body & Bell -->
    <path d="M20.5 21 C18.8 26.5 16.2 30.5 13.5 33.5 L34.5 33.5 C31.8 30.5 29.2 26.5 27.5 21 Z" fill="#ffffff"/>
    <!-- Pawn Base Pedestal -->
    <rect x="12" y="33.5" width="24" height="4.5" rx="2" fill="#ffffff"/>
    <!-- Subtle specular highlight on pawn head -->
    <path d="M22 10.5 Q24 9.5 25.5 10.5 Q24 11.5 22 10.5" fill="#e8f5d8" opacity="0.8"/>
  </g>
</svg>
